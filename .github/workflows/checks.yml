# The design and safety check from DESIGN.md on every pull request and on main. It is the required
# status check in the ruleset, so nothing that breaks the design language can be merged.
# workflow_dispatch: the agent's pull requests are pushed with the workflow token, which starts no
# workflows, so the deliver job starts this one on the agent's branch.

name: checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  design:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Design check
        run: node scripts/check-design.mjs
      - name: Tests for the gate and the deliver checks
        run: node --test scripts/*.test.mjs
